<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Produto</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/produtos}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0" th:text="${produto.id == null ? 'Novo Produto' : 'Editar Produto'}"></h2>
    </div>

    <div class="card shadow-sm" style="max-width: 540px;">
        <div class="card-body p-4">
            <form th:action="${produto.id != null}
                        ? @{/produtos/editar/{id}(id=${produto.id})}
                        : @{/produtos/salvar}"
                  th:object="${produto}" method="post">

                <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}">
                    <ul class="mb-0 small">
                        <li th:each="mensagem : ${#fields.errors('*')}" th:text="${mensagem}"></li>
                    </ul>
                </div>

                <div class="mb-3">
                    <label for="nome" class="form-label fw-medium">Nome do Produto</label>
                    <input type="text" id="nome" class="form-control" th:field="*{nome}" th:errorclass="is-invalid"
                           maxlength="100" placeholder="Ex.: Pizza Calabresa" required>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label fw-medium">Tipo do Produto</label>
                    <select id="tipo" class="form-select" th:field="*{tipo}" th:errorclass="is-invalid" required>
                        <option value="">Selecione o Tipo</option>
                        <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label fw-medium">Preço (R$)</label>
                    <input type="number" id="preco" class="form-control" th:field="*{preco}" th:errorclass="is-invalid"
                           step="0.01" min="0.01" required>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" id="ativo" class="form-check-input" th:field="*{ativo}">
                    <label for="ativo" class="form-check-label">Produto ativo (disponível para venda)</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                    <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
