<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login</title>
    <!-- Link para o CSS do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        /* Estilos adicionais para centralizar o card de login */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card text-center">
            <!-- Espaço para a logo -->
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            <h3 class="mb-4">Bem-vindo</h3>

            <!-- Mensagens de autenticação -->
            <div class="alert alert-danger py-2" th:if="${param.error}">Usuário ou senha inválidos.</div>
            <div class="alert alert-success py-2" th:if="${param.logout}">Você saiu do sistema.</div>
            <div class="alert alert-warning py-2" th:if="${param.expirada}">
                Sua sessão foi encerrada (perfil ou senha alterados). Entre novamente.
            </div>

            <!-- Formulário de Login (th:action inclui o token CSRF automaticamente) -->
            <form th:action="@{/login}" method="post">
                <div class="form-group mb-3 text-start">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Digite seu nome de usuário" required autofocus>
                </div>
                <div class="form-group mb-3 text-start">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Digite sua senha" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <div class="mt-3 small text-muted">
                Esqueceu sua senha? Solicite a redefinição a um administrador.
            </div>
        </div>
    </div>
</body>
</html>
