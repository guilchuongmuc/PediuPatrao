<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a th:href="@{/clientes/novo}" class="btn btn-primary" sec:authorize="hasRole('ATENDENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Indicadores de perfil usados apenas para exibir botões; o backend valida cada operação -->
    <span id="podeEditar" sec:authorize="hasRole('ATENDENTE')" hidden></span>
    <span id="podeExcluir" sec:authorize="hasRole('GERENTE')" hidden></span>

    <div id="mensagemClientes"></div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');
        const podeEditar = document.getElementById('podeEditar') !== null;
        const podeExcluir = document.getElementById('podeExcluir') !== null;

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        function mostrarMensagem(tipo, texto) {
            document.getElementById('mensagemClientes').innerHTML =
                `<div class="alert alert-${tipo} alert-dismissible fade show">${escapeHtml(texto)}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>`;
        }

        async function carregarClientes() {
            const response = await fetch(API_URL);
            if (!response.ok) {
                mostrarMensagem('danger', 'Não foi possível carregar os clientes.');
                return;
            }
            const clientes = await response.json();
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const id = encodeURIComponent(cliente.id);
                const acoes = [];
                if (podeEditar) {
                    acoes.push(`<a href="/clientes/editar/${id}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil-fill"></i> Editar</a>`);
                }
                if (podeExcluir) {
                    acoes.push(`<button class="btn btn-sm btn-outline-danger" data-excluir="${escapeHtml(cliente.id)}">
                            <i class="bi bi-trash-fill"></i> Excluir</button>`);
                }
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="ps-4">${escapeHtml(cliente.nome || '—')}</td>
                    <td>${escapeHtml(cliente.telefone || '—')}</td>
                    <td>${escapeHtml(formatarEndereco(cliente))}</td>
                    <td class="text-end pe-4">${acoes.join('') || '<span class="text-muted small">Somente consulta</span>'}</td>
                `;
                tabelaClientes.appendChild(row);
            });
        }

        tabelaClientes.addEventListener('click', evento => {
            const botao = evento.target.closest('[data-excluir]');
            if (botao) {
                excluirCliente(botao.dataset.excluir);
            }
        });

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const response = await fetch(`${API_URL}/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    headers: csrfHeaders()
                });
                if (response.ok) {
                    mostrarMensagem('success', 'Cliente excluído com sucesso!');
                    carregarClientes();
                } else {
                    const erro = await response.json().catch(() => ({}));
                    mostrarMensagem('danger', erro.mensagem || 'Erro ao excluir o cliente.');
                }
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
