# Configurações locais NÃO versionadas (ex.: URI do MongoDB Atlas com usuário e senha).
# Copie application-local.properties.example para application-local.properties e preencha.
spring.config.import=optional:file:./application-local.properties

# Conexão com o MongoDB: a URI vem da variável MONGODB_URI (ou do arquivo local acima).
# Nenhuma credencial fica gravada no código-fonte.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:pediupatrao}

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Sessão: cookie inacessível ao JavaScript e restrito ao próprio site
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Fuso horário usado nos registros de entrada/saída de pedidos e na auditoria
app.timezone=America/Sao_Paulo

# Usuários iniciais (admin, gerente e atendente) criados somente se ainda não existirem.
# Em produção, defina APP_SEED_SENHA ou desative com app.seed.enabled=false.
app.seed.enabled=true
app.seed.senha-inicial=${APP_SEED_SENHA:Pizza@2026}

logging.level.com.umc.pediupatrao=INFO
